<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816"><meta name="mobile-web-app-capable" content="yes">
<title>Racket Clash</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<section id="menu" class="screen on"><h1>RACKET<br>CLASH</h1>
<button data-go="online">Modo Online</button><button class="alt" data-go="local">Modo Local</button>
<small>Jogue no PC ou no celular — online entre aparelhos diferentes</small></section>
<section id="online" class="screen"><h2>Modo Online</h2>
<button id="mk">Criar sala</button><small>ou entre com o código da sala</small>
<input id="code" maxlength="4" placeholder="CÓDIGO" autocomplete="off" autocapitalize="characters">
<button class="alt" id="jn">Entrar na sala</button><small id="msg"></small><button class="ghost" data-go="menu">Voltar</button></section>
<section id="lobby" class="screen"><h2>Sala criada</h2><div id="room"></div>
<small>Passe o código ao seu amigo e aguarde...</small><button class="ghost" id="lb">Cancelar</button></section>
<section id="local" class="screen"><h2>Modo Local</h2>
<button id="l2">2 Jogadores</button><button class="alt" id="l1">Contra o Robô</button>
<button class="ghost" data-go="menu">Voltar</button></section>
<section id="game" class="screen"><div id="wrap"><canvas id="cv"></canvas>
<div id="hud"><span id="n0">VOCÊ</span><b id="s0">0</b><i>VS</i><b id="s1">0</b><span id="n1">ROBÔ</span></div>
<button id="back">‹</button>
<div id="over"><h2 id="ot"></h2><button id="again">Jogar de novo</button><button class="ghost" id="exit">Menu</button></div>
</div></section>
<script src="script.js"></script></body></html>
